[project]
name = "network_monitor_tds"
version = "0.2.1-beta0"
description = "A network monitor that doesn't sucks"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Gustavo Viera López", email = "gvieralopez@gmail.com" },
]
license = { text = "MIT" }

dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scapy>=2.8.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "sse-starlette>=3.5.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-dotenv",
    "ruff",
    "ebump",
    "pytest-timeout",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[project.scripts]
nmtds = "network_monitor_tds.main:main"

[project.entry-points."network_monitor_tds.plugins"]
arp-sweep = "network_monitor_tds.plugins.builtin.arp.plugin:ArpSweepPlugin"
arp-listen = "network_monitor_tds.plugins.builtin.arp.plugin:ArpListenerPlugin"
dhcp-sniff = "network_monitor_tds.plugins.builtin.dhcp.plugin:DhcpSnifferPlugin"
oui = "network_monitor_tds.plugins.builtin.oui.plugin:OuiPlugin"
technitium = "network_monitor_tds.plugins.builtin.technitium.plugin:TechnitiumPlugin"
demo = "network_monitor_tds.plugins.builtin.demo.plugin:DemoPlugin"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
src = ["src", "tests", "scripts"]
extend-exclude = [".cookie-pyrate"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins: Check variables shadowing
    "ARG",    # flake8-unusedarguments
    "B",      # flake8-bugbear: Finds likely bugs and design problems
    "C901",   # Mccabe complexity checker
    "ERA",    # Erradicate
    "E4",     # Pycodestyle: Line length, indentation, etc.
    "E7",     # Pycodestyle: Miscellaneous checks
    "E9",     # Pycodestyle: Syntax errors
    "F",      # Pyflakes: Unused imports, undefined variables, etc.
    "FIX",    # Avoid lines containing TODO tags
    "G",      # flake8-logging-format: Ensure logging messages follow best practices.
    "I",      # Isort: Import sorting
    "LOG",    # flake8-logging: Use the logging module correctly
    "N",      # pep8-naming: Enforce naming conventions
    "PGH004", # Enforce specify the rule to avoid on noqa tags
    "PL",     # Pylint
    "PTH",    # flake8-use-pathlib: Enforces pathlib usage
    "RUF",    # Ruff-specific rules: Mostly for handling noqa tags and general stuff
    "S",      # flake8-bandit: Identifies common security issues in code
    "SIM",    # flake8-simplify
    "T20",    # flake8-print: Avoids print in the code
    "UP",     # Pyupgrade
    "W",      # Pycodestyle warnings
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101", "S104", "S105", "S106", "PLR2004", "PLR0913"]
"scripts/**" = ["T20", "S603"]  # Allow print statements and subprocess calls on the scripts

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true


[tool.mypy]
python_version = "3.14"
files = ["src", "scripts", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
extra_checks = true


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=80"
timeout = 10
python_files = "tests.py test_*.py *_test.py"
pythonpath = "./src"
env_override_existing_values = 1
env_files = [".env.test"]


[tool.ebump.patterns]
"src/network_monitor_tds/__init__.py" = ['^__version__ = "{version}"$']
